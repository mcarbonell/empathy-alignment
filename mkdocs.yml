      - "Métricas de Nivel de Conciencia": research/metrica_conciencia_nivel.md
      - "Regulador Huérfano y Extensiones Cognitivas": research/regulador_huerfano_extensiones_cognitivas_y_agi.md
      - "Síntesis del Modelo Computacional": research/sintesis_modelo_computacional_conciencia_v1.md
      - "Marco Regulador Conciencia v2": research/marco_regulador_conciencia_inteligencia_v2.md
